# Builds every platform on GitHub's machines and publishes them as a GitHub release.
# Run it from the Actions tab: "Build and release" -> "Run workflow".
name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Check out the game (with Git LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17 for the Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and its export templates
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm templates.tpz godot.zip
          godot --version

      - name: Android signing (debug key) and SDK path
        run: |
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import assets (compresses every texture; the slow step)
        run: godot --headless --path . --import

      - name: Export all four platforms
        run: |
          v="${{ inputs.version }}"
          mkdir -p dist
          godot --headless --path . --export-release "Windows" "dist/HouseBeyondMidnight-$v-Windows.exe"
          godot --headless --path . --export-release "Linux" "dist/HouseBeyondMidnight-$v-Linux.x86_64"
          godot --headless --path . --export-release "macOS" "dist/HouseBeyondMidnight-$v-macOS.zip"
          godot --headless --path . --export-debug "Android" "dist/HouseBeyondMidnight-$v-Android.apk"
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          notes="docs/releases/$v.md"
          [ -f "$notes" ] || notes="CHANGELOG.md"
          gh release create "v$v" dist/* --title "v$v" --notes-file "$notes" --target "${{ github.sha }}"
